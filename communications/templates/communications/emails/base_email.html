<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>

<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#002d5a;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f5f5f5;">
        <tr>
            <td align="center" style="padding:40px 20px;">

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                       style="width:100%;max-width:620px;background:#f5f5f5;border-radius:8px;overflow:hidden;">
                    <!-- BRAND HEADER -->
                    <tr>
                        <td align="center" style="padding:32px 40px 20px;background:#002D5A;">
                            <img src="{{ logo_url }}"
                                 alt="English Grows"
                                 width="180"
                                 style="display:block;width:180px;max-width:100%;height:auto;border:0;">
                        </td>
                    </tr>
                    <!-- SPACER BLANK ROW between logo row and header -->
                    <tr>
                        <td height="36" style="height:36px;line-height:36px;font-size:0;">&nbsp;</td>
                    </tr>

                    <!-- EMAIL HEADING -->
                    {% if heading %}
                        <tr>
                            <td align="center" style="padding:6px 40px 24px;">
                                <h1 style="margin:0;font-size:26px;line-height:1.25;font-weight:600;color:#002d5a;">
                                    {{ heading }}
                                </h1>
                            </td>
                        </tr>
                    {% endif %}

                    <!-- EDITABLE EMAIL CONTENT -->
                    <tr>
                        <td style="padding:8px 40px 36px;font-size:16px;line-height:1.65;color:#4f6870;">
                            {{ body_html|safe }}
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td align="center"
                            style="padding:22px 40px 28px;border-top:1px solid #e5ecee;font-size:13px;line-height:1.5;color:#7a949b;">
                            English Grows
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
