{% extends "profiles/profile_base.html" %}
{% load static i18n %}


{% block profile_content %}

<section class="profile-page student-detail-page notranslate {% block details_page_class %}{% endblock %}" translate="no" {% block details_page_attributes %}{% endblock %}>

    <div class="row mb-3">
        <div class="col-12 mb-2">
            <p class="go-back-link">
                <a href="#" class="js-back-link">
                    <img
                        src="{% static 'icons/go_back_teal_icon.png' %}"
                        alt=""
                        width="56"
                        aria-hidden="true"
                    >
                    {% trans "Go Back" %}
                </a>
            </p>
        </div>
    </div>


    <header class="details-page__header">
        {% block details_header %}{% endblock %}
    </header>


    <div class="details-page__navigation">
        {% block details_nav %}{% endblock %}
    </div>


    <main class="details-page__content">
        {% block details_content %}{% endblock %}
    </main>

</section>

{% endblock %}
