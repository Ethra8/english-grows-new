{% extends "profiles/profile_base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'profiles/css/profiles_base.css' %}">
<link rel="stylesheet" href="{% static 'profiles/css/features/calendar.css' %}">
{% endblock %}

{% block extra_title %}| Calendar{% endblock %}


{% block profile_content %}

<div class="overlay-birds"></div>
<div class="overlay-azure-mist"></div>

<div id="my_calendar_page">
    <div class="container mb-4">
        <h1>Class Calendar</h1>
        <hr>
        <div
            id="calendar"
            data-events-url="{% url 'profiles:teacher_calendar_events' %}"
            data-role="teacher">
        </div>    
    </div>
</div>

<div class="modal fade" id="classSessionModal" tabindex="-1" role="dialog" aria-labelledby="classSessionModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content calendar-session-modal">

            <div class="modal-header">
                <h5 class="modal-title" id="classSessionModalTitle"></h5>

                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <p class="mb-2">
                    <strong>When:</strong>
                    <span id="classSessionModalTime"></span>
                </p>

                <p class="mb-2">
                    <strong>Course:</strong>
                    <span id="classSessionModalCourse"></span>
                </p>

                <p class="mb-0">
                    <strong>Class:</strong>
                    <span id="classSessionModalClassNumber"></span>
                </p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">
                    Close
                </button>

                <a href="#"
                   target="_blank"
                   rel="noopener noreferrer"
                   id="classSessionModalJoinBtn"
                   class="btn calendar-modal-join-btn">
                    Join class
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}


{% block postloadjs %}
    {{ block.super }}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script type="text/javascript" src="{% static 'profiles/js//components/calendar.js' %}"></script>
{% endblock %}
