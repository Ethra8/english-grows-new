<aside id="profileSidebar" class="profile-sidebar">

    <div class="sidebar-user mb-3">
        {% if request.user.profile.profile_photo %}
            <img src="{{ request.user.profile.profile_photo.url }}" alt="Profile photo" class="profile-photo">
        {% else %}
            <div class="sidebar-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
        {% endif %}

        <h2>{{ request.user.first_name|default:request.user.username }}</h2>

        <!-- badge user role -->
        <span class="text-center mt-4 mb-3">
            <i class="fa-solid fa-graduation-cap mr-2 mr-2"></i> 
            {{ request.user.profile.get_role_display }}
        </span>

    </div>
    <hr>

    <nav class="sidebar-nav" aria-label="Profile navigation">

        <a href="{% url 'profiles:teacher_dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'teacher_dashboard' %}active{% endif %}">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <a href="{% url 'profiles:teacher_classes_list' %}" class="sidebar-link {% if request.resolver_match.url_name == 'teacher_classes_list' %}active{% endif %}">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>My Classes</span>
        </a>

        <a href="{% url 'profiles:teacher_attendance' %}" class="sidebar-link {% if request.resolver_match.url_name == 'teacher_attendance' %}active{% endif %}">
            <i class="fa-solid fa-list-check"></i>
            <span>Attendance</span>
        </a>

        <a href="{% url 'profiles:teacher_courses' %}" class="sidebar-link {% if request.resolver_match.url_name == 'teacher_courses' %}active{% endif %}">
            <i class="fa-solid fa-circle-info"></i>
            <span>Courses / Levels</span>
        </a>

        <a href="{% url 'profiles:teacher_calendar' %}" class="sidebar-link {% if request.resolver_match.url_name == 'teacher_calendar' %}active{% endif %}">
            <i class="fa-regular fa-calendar-days"></i>
            <span>Calendar</span>
        </a>

        <a href="{% url 'profiles:teacher_reschedule_classes' %}" class="sidebar-link {% if request.resolver_match.url_name == '#' %}active{% endif %}">
            <i class="fa-regular fa-calendar-plus"></i>
            <span>Reschedule</span>
        </a>

        <a href="#" class="sidebar-link {% if request.resolver_match.url_name == '#' %}active{% endif %}">
            <i class="fa-solid fa-chart-line"></i>
            <span>Evaluations</span>
        </a>

        <a href="#" class="sidebar-link {% if request.resolver_match.url_name == '#' %}active{% endif %}">
            <i class="fa-solid fa-folder-open"></i>
            <span>Materials</span>
        </a>

        <a href="{% url 'profiles:teacher_profile_settings' %}" class="sidebar-link {% if request.resolver_match.url_name == 'teacher_profile_settings' %}active{% endif %}">
            <i class="fa-solid fa-user-gear"></i>
            <span>Account Settings</span>
        </a>
    </nav>
    <hr>

    <a href="{% url 'account_logout' %}" class="btn-navbar mb-5" aria-label="Logout">
        <i class="fa-solid fa-arrow-right-from-bracket mr-2 mt-1"></i>
        Logout
    </a>

</aside>
