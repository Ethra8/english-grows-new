{% load static %}
{% load i18n %}

<a
    href="{% url 'profiles:company_admin_course_details' session.course.id %}"
    class="assigned-class-row"
    data-status-group="{{ session.class_status_group }}"
    data-today="{{ session.is_today|yesno:'true,false' }}"
    data-weekly="{{ session.is_this_week|yesno:'true,false' }}"
    data-monthly="{{ session.is_this_month|yesno:'true,false' }}"
>

    <div class="class-list-course">
            <img src="{% static 'icons/class_session_icon.png' %}" alt="" aria-hidden="true" width="46">
            <div>
                <strong>{{ session.course.name }}</strong>
                <span>Lesson {{ session.class_number }}</span>
            </div>
    </div>


    <div>
        <span class="level level-{{ session.course.course_level|lower|cut:'.' }}">
            {{ session.course.course_level|default:"Pending" }}
        </span>
    </div>


    <div class="class-list-date">

        <div class="icon">
            <!-- <i class="fa-solid fa-calendar-day"></i> -->
            <img src="{% static 'icons/calendar_teal_icon.png' %}" alt="" aria-hidden="true" width="22">
        </div>

        <div>
            <strong>
                {{ session.start_time|date:"D, j M" }}
            </strong>

            <span>
                {{ session.start_time|time:"H:i" }}
                -
                {{ session.end_time|time:"H:i" }}
            </span>
        </div>

    </div>


    <div class="class-list-student-num">

        <div class="icon">
            <!-- <img src="{% static 'icons/class_list_users_icon.png' %}" alt="" aria-hidden="true" width="26"> -->
             <img src="{% static 'icons/class_list_users_icon.png' %}" alt="" aria-hidden="true" width="26">
        </div>

        <strong>
            {{ session.course.enrollments.count }}
        </strong>

    </div>

</a>
